<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <meta name="referrer" content="no-referrer">
  <!-- Belt and braces with the route's Referrer-Policy header: the token is in
       this page's URL and must not travel anywhere in a Referer. -->
  <title>Confirm your email - Awesome MCP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .hidden { display: none !important; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000;
      color: #ededed;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    :focus-visible { outline: 2px solid #0070f3; outline-offset: 2px; border-radius: 4px; }
    .card {
      background: #0a0a0a;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 2.5rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .icon { font-size: 2rem; line-height: 1; margin-bottom: 0.85rem; }
    h1 { font-size: 1.4rem; letter-spacing: -0.02em; margin-bottom: 0.6rem; }
    p { color: #888; line-height: 1.55; margin-bottom: 1.75rem; font-size: 0.95rem; }
    .btn-primary {
      width: 100%;
      padding: 0.85rem 1.5rem;
      background: #0070f3;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background-color 0.2s;
      touch-action: manipulation;
    }
    .btn-primary:hover:not(:disabled) { background: #005bb5; }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .footer { margin-top: 1.5rem; font-size: 0.78rem; color: #666; line-height: 1.5; }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">&#9993;</div>
    <h1>Confirm your email</h1>
    <p>Click below to finish creating your account.</p>

    <!-- A form POST, not a link. The account is created by this submission
         alone, so a mail scanner that fetches the URL cannot make it happen. -->
    <form method="POST" action="/auth/verify" id="confirmForm">
      <input type="hidden" name="token" id="tokenField">
      <button type="submit" class="btn-primary" id="confirmBtn">Confirm and continue</button>
    </form>

    <p class="footer">
      If you didn't sign up, close this page — nothing is created until you confirm.
    </p>
  </main>

  <script>
    (function () {
      // The token travels in the query string; move it into the form body so
      // the submission carries it and the URL does not need to be followed.
      var token = new URLSearchParams(window.location.search).get('token') || '';
      if (!token) {
        window.location.replace('/login?verify=invalid');
        return;
      }
      document.getElementById('tokenField').value = token;

      var form = document.getElementById('confirmForm');
      var btn = document.getElementById('confirmBtn');
      form.addEventListener('submit', function () {
        // Double submits race for one single-use token; the loser would be
        // told the link is invalid straight after it worked.
        btn.disabled = true;
        btn.textContent = 'Confirming…';
      });
    })();
  </script>
</body>
</html>
