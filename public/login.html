<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Sign in - Awesome MCP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .hidden { display: none !important; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000;
      color: #ededed;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    :focus-visible {
      outline: 2px solid #0070f3;
      outline-offset: 2px;
      border-radius: 4px;
    }
    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .auth-card {
      background: #0a0a0a;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 2.5rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
      max-width: 420px;
      width: 100%;
    }
    .auth-card h1 {
      font-size: 1.5rem;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
      text-align: center;
    }
    .auth-subtitle {
      color: #888;
      margin-bottom: 2rem;
      line-height: 1.5;
      text-align: center;
      font-size: 0.95rem;
    }

    .btn-google-login {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      width: 100%;
      padding: 0.85rem 1.5rem;
      background: #fff;
      color: #333;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.2s, border-color 0.2s;
      touch-action: manipulation;
    }
    .btn-google-login:hover { background: #f8f9fa; border-color: #ccc; }
    .btn-google-login svg { width: 20px; height: 20px; }

    .divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 1.5rem 0;
      color: #666;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.1);
    }

    .field { margin-bottom: 1rem; }
    .field label {
      display: block;
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 0.4rem;
    }
    .field input {
      width: 100%;
      padding: 0.75rem 0.9rem;
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      color: #ededed;
      font-size: 0.95rem;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    .field input:focus { border-color: #0070f3; outline: none; }
    .field .hint { font-size: 0.75rem; color: #666; margin-top: 0.35rem; }

    .btn-primary {
      width: 100%;
      padding: 0.85rem 1.5rem;
      background: #0070f3;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background-color 0.2s;
      touch-action: manipulation;
    }
    .btn-primary:hover:not(:disabled) { background: #005bb5; }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    .form-error {
      background: rgba(220, 38, 38, 0.12);
      border: 1px solid rgba(220, 38, 38, 0.35);
      color: #fca5a5;
      border-radius: 8px;
      padding: 0.7rem 0.9rem;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      line-height: 1.45;
    }

    .toggle-line {
      margin-top: 1.25rem;
      text-align: center;
      font-size: 0.85rem;
      color: #888;
    }
    .toggle-line button {
      background: none;
      border: none;
      color: #4f8df7;
      font: inherit;
      cursor: pointer;
      padding: 0;
      text-decoration: underline;
    }
    .auth-footer {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: #666;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main class="auth-card">
    <h1 id="authTitle">Sign in</h1>
    <p class="auth-subtitle" id="authSubtitle">Access your MCP dashboard and connectors.</p>

    <a href="/auth/google" class="btn-google-login">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continue with <span translate="no">Google</span>
    </a>

    <div class="divider">or</div>

    <div id="formError" class="form-error hidden" role="alert" aria-live="assertive"></div>

    <form id="authForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required placeholder="you@company.com">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required
               autocomplete="current-password" placeholder="Your password">
        <p class="hint hidden" id="passwordHint">At least 10 characters.</p>
      </div>

      <button type="submit" class="btn-primary" id="submitBtn">Sign in</button>
    </form>

    <p class="toggle-line">
      <span id="toggleText">Don't have an account?</span>
      <button type="button" id="toggleMode">Create one</button>
    </p>

    <p class="auth-footer">
      Connecting a <span translate="no">Google</span> service is done per-connector from the dashboard,
      whichever way you sign in.
    </p>
  </main>

  <script>
    (function () {
      var MIN_PASSWORD_LENGTH = 10;
      var mode = 'login';

      var form = document.getElementById('authForm');
      var errorBox = document.getElementById('formError');
      var submitBtn = document.getElementById('submitBtn');
      var passwordHint = document.getElementById('passwordHint');
      var passwordInput = document.getElementById('password');
      var title = document.getElementById('authTitle');
      var subtitle = document.getElementById('authSubtitle');
      var toggleText = document.getElementById('toggleText');
      var toggleBtn = document.getElementById('toggleMode');

      function showError(message) {
        errorBox.textContent = message;
        errorBox.classList.remove('hidden');
      }

      function clearError() {
        errorBox.textContent = '';
        errorBox.classList.add('hidden');
      }

      function setMode(next) {
        mode = next;
        clearError();
        var registering = mode === 'register';

        title.textContent = registering ? 'Create your account' : 'Sign in';
        subtitle.textContent = registering
          ? 'Sign up with an email and password — no Google account required.'
          : 'Access your MCP dashboard and connectors.';
        submitBtn.textContent = registering ? 'Create account' : 'Sign in';
        toggleText.textContent = registering ? 'Already have an account?' : "Don't have an account?";
        toggleBtn.textContent = registering ? 'Sign in' : 'Create one';

        passwordHint.classList.toggle('hidden', !registering);
        passwordInput.setAttribute('autocomplete', registering ? 'new-password' : 'current-password');
        passwordInput.setAttribute('placeholder', registering ? 'At least 10 characters' : 'Your password');
      }

      toggleBtn.addEventListener('click', function () {
        setMode(mode === 'login' ? 'register' : 'login');
      });

      // Deep-link straight into the sign-up form: /login?mode=register
      if (new URLSearchParams(window.location.search).get('mode') === 'register') {
        setMode('register');
      }

      form.addEventListener('submit', async function (event) {
        event.preventDefault();
        clearError();

        var email = document.getElementById('email').value.trim();
        var password = passwordInput.value;

        if (!email || !password) {
          showError('Email and password are required.');
          return;
        }
        // Mirrors the server's rule so the user sees it before a round-trip;
        // the server enforces it regardless.
        if (mode === 'register' && password.length < MIN_PASSWORD_LENGTH) {
          showError('Password must be at least ' + MIN_PASSWORD_LENGTH + ' characters.');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = mode === 'register' ? 'Creating account…' : 'Signing in…';

        try {
          var res = await fetch('/api/auth/' + (mode === 'register' ? 'register' : 'login'), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({ email: email, password: password }),
          });

          var data = await res.json().catch(function () { return {}; });

          if (!res.ok) {
            showError(data.error || 'Something went wrong. Please try again.');
            return;
          }

          window.location.href = data.redirectTo || '/dashboard';
        } catch (err) {
          showError('Network error. Please check your connection and try again.');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = mode === 'register' ? 'Create account' : 'Sign in';
        }
      });
    })();
  </script>
</body>
</html>
