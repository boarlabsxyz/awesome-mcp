sonar.projectKey=boarlabsxyz_awesome-mcp
sonar.organization=boarlabsxyz
sonar.sources=src
sonar.tests=tests,src/__tests__
sonar.test.inclusions=**/*.test.ts,**/*.test.js,**/*.spec.ts,**/*.spec.js
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.test.ts,**/*.test.js,**/*.spec.ts,**/*.spec.js
# Run by Deno, not Node, so c8 never sees them; the Deno suite
# (src/__tests__/sandbox/runner/deno.test.ts) exercises them when Deno is installed.
sonar.coverage.exclusions=src/sandbox/runner/worker.ts,src/sandbox/runner/prefetch.ts
